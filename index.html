<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>客户管理助手</title>
<meta name="theme-color" content="#172033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="客户管理助手">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#6d7890;
  --primary:#1f6feb; --border:#dfe5ef; --ok:#15803d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 90px}
h1{font-size:24px;margin:8px 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(20,36,70,.05)}
.step{font-size:13px;color:var(--primary);font-weight:700;margin-bottom:8px}
.question{font-size:22px;font-weight:750;margin-bottom:16px}
input,textarea,select{width:100%;font-size:18px;padding:14px;border:1px solid var(--border);border-radius:12px;background:#fff;outline:none}
textarea{min-height:150px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,111,235,.10)}
.row{display:flex;gap:10px;margin-top:16px}
button{border:0;border-radius:12px;padding:14px 16px;font-size:17px;font-weight:700;cursor:pointer}
.primary{background:var(--primary);color:white;flex:1}
.secondary{background:#eef3fa;color:#25324a}
.small{padding:10px 12px;font-size:14px}
.hidden{display:none}
.progress{height:6px;background:#e8edf5;border-radius:99px;margin:0 0 14px;overflow:hidden}
.bar{height:100%;background:var(--primary);width:0;transition:width .2s}
.done{text-align:center;padding:20px 6px}
.done .check{font-size:48px}
.done h2{margin:8px 0}
.tabs{display:flex;gap:8px;margin:14px 0}
.tab{flex:1;background:#e9eef6;color:#33415c}
.tab.active{background:#172033;color:#fff}
.customer{background:white;border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0}
.customer h3{margin:0 0 8px;font-size:18px}
.meta{font-size:14px;color:var(--muted);line-height:1.6}
.hist{font-size:14px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);white-space:pre-wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.notice{background:#fff7d6;border:1px solid #f0df9a;border-radius:12px;padding:10px 12px;font-size:13px;color:#66571b;margin-bottom:14px}
.badge{display:inline-block;background:#edf4ff;color:#1756a9;border-radius:999px;padding:4px 8px;font-size:12px;margin:2px 4px 2px 0}

.matchbox{margin-top:12px;padding:12px;border:1px solid #cfe0fb;background:#f5f9ff;border-radius:12px}
.matchtitle{font-size:13px;font-weight:700;color:#1f6feb;margin-bottom:8px}
.matchitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px dashed #dce6f5}
.matchitem:first-of-type{border-top:0}
.matchname{font-size:15px;font-weight:650}
.matchmeta{font-size:12px;color:var(--muted);margin-top:3px}
.usebtn{background:#e8f1ff;color:#1756a9;padding:8px 10px;font-size:13px;white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.selectednotice{margin-top:10px;padding:10px 12px;border-radius:10px;background:#ecfdf3;border:1px solid #b7ebc6;color:#166534;font-size:14px;font-weight:700}
.datastatus{background:#eef8f0;border:1px solid #c7e5ce;border-radius:12px;padding:10px 12px;font-size:13px;color:#245b31;margin-bottom:14px;line-height:1.55}
.datastatus b{color:#174d24}

.historypreview{margin-top:12px;border:1px solid #cfe0f7;background:#f7fbff;border-radius:12px;padding:12px}
.historypreview .htitle{font-size:14px;font-weight:800;color:#1756a9;margin-bottom:8px}
.historypreview .hitem{padding:9px 0;border-top:1px dashed #d9e5f3;font-size:14px;line-height:1.55}
.historypreview .hitem:first-of-type{border-top:0}
.historypreview .hdate{font-weight:700;color:#33415c}
.historypreview .hempty{font-size:13px;color:var(--muted)}

.dashboard-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:26px;margin-top:4px}
.task{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0}
.task.overdue{border-left:5px solid #dc2626}.task.today{border-left:5px solid #f59e0b}.task.future{border-left:5px solid #2563eb}
.tasktop{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pri{font-size:12px;font-weight:800;border-radius:999px;padding:4px 8px;background:#eef3fa}
.voicebox{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px}
.mic{width:100%;font-size:20px;background:#172033;color:#fff;margin:10px 0}
.transcript{min-height:110px}
.confirmgrid{display:grid;gap:10px;margin-top:12px}
.confirmitem{background:#f7f9fc;border:1px solid var(--border);border-radius:12px;padding:10px}
.warn{background:#fff7d6;border-color:#f0df9a}
.choicebar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.choicebar button{padding:8px 10px;font-size:13px}
.sectiontitle{font-size:19px;font-weight:800;margin:18px 0 8px}
@media(min-width:700px){.dashboard-grid{grid-template-columns:repeat(4,1fr)}}


.candidatebox{margin-top:8px}.candidate{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--border)}.candidate:first-child{border-top:0}.confhigh{color:#166534}.confmid{color:#92400e}.conflow{color:#991b1b}.confidence{font-size:12px;font-weight:800}

.dbactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.editbtn{background:#e8f1ff;color:#1756a9;padding:8px 10px;font-size:13px}
.delbtn{background:#fee2e2;color:#991b1b;padding:8px 10px;font-size:13px}
.contactrow{border:1px solid var(--border);border-radius:10px;padding:10px;margin:8px 0;background:#fafcff}
.histactions{display:flex;gap:6px;margin-top:8px}

.attachbox{margin-top:10px;padding:10px;border:1px solid var(--border);border-radius:12px;background:#f8fafc}
.attachitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--border)}
.attachitem:first-child{border-top:0}.attachmeta{min-width:0;flex:1}.attachname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkinput{width:100%;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>客户管理助手</h1>
  <div class="sub">PWA 测试版 V4 · 语音新增 · 客户库可维护 · 本地附件与链接</div>

  <div class="tabs">
    <button class="tab active" id="tabDash" onclick="showTab('dash')">看板</button>
    <button class="tab" id="tabVoice" onclick="showTab('voice')">语音录入</button>
    <button class="tab" id="tabDB" onclick="showTab('db')">客户库</button>
  </div>

  <section id="dashPanel">
    <div class="dashboard-grid">
      <div class="kpi">已逾期<b id="kOverdue">0</b></div>
      <div class="kpi">今天<b id="kToday">0</b></div>
      <div class="kpi">未来7天<b id="kWeek">0</b></div>
      <div class="kpi">等待客户<b id="kWaiting">0</b></div>
    </div>
    <div class="sectiontitle">今天最该处理</div>
    <div id="taskList"></div>
  </section>

  <section id="voicePanel" class="hidden">
    <div class="voicebox">
      <div class="question">🎙️ 说一次拜访</div><div class="notice"><b>新增只走语音：</b>识别后所有字段都可以在确认页修改；确认无误后再保存。</div>
      <div class="meta">例如：今天拜访西开电气王经理，聊了550项目，下周三上午十点跟进，比较重要。</div>
      <button class="mic" id="micBtn" onclick="toggleVoice()">开始说话</button>
      <textarea id="voiceText" class="transcript" placeholder="识别结果会出现在这里；也可以直接粘贴或手动输入。"></textarea>
      <div class="row"><button class="primary" onclick="extractVoice()">提取关键信息</button></div>
      <div id="voiceConfirm"></div>
    </div>
  </section>

  <section id="formPanel" class="hidden" style="display:none!important">
    <div class="notice"><b>主数据规则：</b>JSON 文件是正式主数据；浏览器中的数据只作为临时工作副本。每次保存一条记录后，会自动生成一份最新 JSON 主数据文件。</div>
    <div class="datastatus" id="dataStatus">正在检查主数据状态…</div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="card" id="formCard">
      <div class="step" id="stepLabel"></div>
      <div class="question" id="question"></div>
      <div id="field"></div>
      <div class="row">
        <button class="secondary" id="backBtn" onclick="prevStep()">上一步</button>
        <button class="primary" id="nextBtn" onclick="nextStep()">下一步</button>
      </div>
    </div>

    <div class="card hidden" id="doneCard">
      <div class="done">
        <div class="check">✅</div>
        <h2>已保存</h2>
        <div class="meta" id="doneText"></div>
        <div class="row">
          <button class="primary" onclick="showTab('voice')">继续语音录入</button>
          <button class="secondary" onclick="showTab('db')">查看客户库</button>
        </div>
      </div>
    </div>
  </section>

  <section id="dbPanel" class="hidden">
    <div class="toolbar">
      <button class="secondary small" onclick="exportJSON(false)">导出主数据 JSON</button>
      <button class="secondary small" onclick="document.getElementById('importFile').click()">导入主数据 JSON</button>
      <button class="secondary small" onclick="exportCSV()">导出 CSV 查看</button>
      <input id="importFile" type="file" accept=".json" class="hidden" onchange="importJSON(event)">
    </div>
    <input id="search" placeholder="搜索客户 / 联系人 / 电话" oninput="renderDB()" style="margin:8px 0 12px">
    <div id="dbList"></div>
  </section>
</div>

function nowText() {

  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function normalizeName(s) {
  return String(s||'')
    .toLowerCase()
    .replace(/（.*?）|\(.*?\)/g,'')
    .replace(/[\s·•・_.，,。;；:：\-—_]/g,'')
    .replace(/有限责任公司|股份有限公司|有限公司|集团有限公司|集团|公司/g,'')
    .replace(/电气设备|电气|开关设备|开关|高压电器|高压|中压/g,'');
}

function similarity(a,b) {
  a=normalizeName(a); b=normalizeName(b);
  if(!a || !b) return 0;
  if(a===b) return 1;
  if(a.includes(b) || b.includes(a)) return Math.min(a.length,b.length)/Math.max(a.length,b.length)+0.18;
  const A=new Set(a), B=new Set(b);
  let inter=0; A.forEach(x=>{if(B.has(x)) inter++});
  return inter / Math.max(A.size,B.size);
}

function customerMatches(name) {
  const n=normalizeName(name);
  if(!n) return [];
  return data.map(c=>({c,score:similarity(name,c.name)}))
    .filter(x=>x.score>=0.45)
    .sort((a,b)=>b.score-a.score)
    .slice(0,5);
}

function getCustomer(name) {
  const exact=data.find(c => c.name === name);
  if(exact) return exact;
  const n=normalizeName(name);
  return data.find(c=>normalizeName(c.name)===n);
}

function contactMatches(customer,name) {
  if(!customer || !name) return [];
  return (customer.contacts||[]).map(ct=>({ct,score:similarity(name,ct.name)}))
    .filter(x=>x.score>=0.5)
    .sort((a,b)=>b.score-a.score)
    .slice(0,5);
}

function getContact(customer,name) {
  if(!customer) return null;
  const exact=(customer.contacts||[]).find(x=>x.name===name);
  if(exact) return exact;
  const n=normalizeName(name);
  return (customer.contacts||[]).find(x=>normalizeName(x.name)===n) || null;
}

function showSelectedNotice(text) {
  const f=document.getElementById('field');
  if(!f) return;
  let n=document.getElementById('selectedNotice');
  if(!n) {
    n=document.createElement('div');
    n.id='selectedNotice';
    n.className='selectednotice';
    f.appendChild(n);
  }
  n.textContent=text;
}

function clearSelectedNotice() {
  document.getElementById('selectedNotice')?.remove();
}

function useCustomer(name) {
  answers.customer=name;
  answers.contact=''; answers.phone='';
  const c=getCustomer(name);
  if(c?.defaultOffice) answers.office=c.defaultOffice;
  const input=document.getElementById('currentField');
  if(input) input.value=name;
  const box=document.getElementById('matchBox');
  if(box) { box.innerHTML=''; box.classList.add('hidden'); }
  showSelectedNotice('✓ 已归入已有客户：'+name);
}

function useContact(name) {
  answers.contact=name;
  const input=document.getElementById('currentField');
  if(input) input.value=name;
  const c=getCustomer(answers.customer);
  const ct=getContact(c,name);
  if(ct) {
    answers.phone=ct.phone||answers.phone||'';
    answers.office=ct.office||c?.defaultOffice||answers.office||'';
  }
  const box=document.getElementById('matchBox');
  if(box) { box.innerHTML=''; box.classList.add('hidden'); }
  showSelectedNotice('✓ 已使用已有联系人：'+name+'；本次拜访会追加到此联系人名下');
  renderContactHistoryPreview();
}

function renderCustomerMatches() {
  const box=document.getElementById('matchBox');
  const input=document.getElementById('currentField');
  if(!box || !input) return;
  const q=input.value.trim();
  const matches=customerMatches(q);
  if(!q || !matches.length) { box.innerHTML=''; box.classList.add('hidden'); return; }
  box.innerHTML='';
  box.classList.remove('hidden');
  const title=document.createElement('div');
  title.className='matchtitle';
  title.textContent='数据库里可能已经有这个客户：';
  box.appendChild(title);
  matches.forEach(x=>{
    const row=document.createElement('div'); row.className='matchitem';
    const left=document.createElement('div');
    const nm=document.createElement('div'); nm.className='matchname'; nm.textContent=x.c.name;
    const meta=document.createElement('div'); meta.className='matchmeta'; meta.textContent=`${(x.c.contacts||[]).length} 个联系人 · ${(x.c.history||[]).length} 条拜访记录`;
    left.appendChild(nm); left.appendChild(meta);
    const btn=document.createElement('button'); btn.type='button'; btn.className='usebtn'; btn.textContent='归到这里';
    btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();useCustomer(x.c.name);});
    row.appendChild(left); row.appendChild(btn); box.appendChild(row);
  });
  const hint=document.createElement('div'); hint.className='hint'; hint.textContent='如果都不是同一个客户，继续输入原名称，保存时会新建客户。'; box.appendChild(hint);
}

function renderContactMatches() {
  const box=document.getElementById('matchBox');
  const input=document.getElementById('currentField');
  if(!box || !input) return;
  const c=getCustomer(answers.customer);
  const q=input.value.trim();

function contactHistory(customer, contactName) {
  if(!customer || !contactName) return [];
  const n=normalizeName(contactName);
  return (customer.history||[])
    .filter(h=>normalizeName(h.contact||'')===n)
    .slice()
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''))
    .slice(0,3);
}

function renderContactHistoryPreview() {
  const box=document.getElementById('historyPreview');
  const input=document.getElementById('currentField');
  if(!box || !input) return;
  const c=getCustomer(answers.customer);
  const typed=(input.value||'').trim();
  const ct=getContact(c,typed);
  if(!c || !ct) { box.innerHTML=''; box.classList.add('hidden'); return; }
  const hist=contactHistory(c,ct.name);
  box.classList.remove('hidden');
  if(!hist.length) {
    box.innerHTML=`<div class="htitle">${esc(ct.name)} · 最近拜访</div><div class="hempty">暂无这个联系人的历史拜访记录。</div>`;
    return;
  }
  box.innerHTML=`<div class="htitle">${esc(ct.name)} · 最近 ${hist.length} 次拜访</div>` + hist.map(h=>`
    <div class="hitem">
      <div class="hdate">${esc(h.date||'未填写日期')}</div>
      <div>${esc(h.content||'')}</div>
      ${h.todo?`<div class="meta">待办：${esc(h.todo)}</div>`:''}
    </div>`).join('');
}

    input.addEventListener('input',()=>{clearSelectedNotice();renderCustomerMatches();});
    setTimeout(renderCustomerMatches,0);
  } else if (s.type === 'contact') {
    const input = document.createElement('input');
    input.setAttribute('list','contactList');
    input.placeholder='输入或选择联系人';
    input.value=answers.contact;
    input.id='currentField';
    const dl=document.createElement('datalist'); dl.id='contactList';
    const c=getCustomer(answers.customer);
    (c?.contacts||[]).forEach(x=>{const o=document.createElement('option');o.value=x.name;dl.appendChild(o)});
    f.appendChild(input); f.appendChild(dl);
    const box=document.createElement('div'); box.id='matchBox'; box.className='matchbox hidden'; f.appendChild(box);
    const hp=document.createElement('div'); hp.id='historyPreview'; hp.className='historypreview hidden'; f.appendChild(hp);
    input.addEventListener('input',()=>{clearSelectedNotice();renderContactMatches();renderContactHistoryPreview();});
    setTimeout(()=>{renderContactMatches();renderContactHistoryPreview();},0);
  } else if (s.type === 'textarea') {
    const ta=document.createElement('textarea'); ta.id='currentField'; ta.value=answers[s.key]||'';
    ta.placeholder=s.key==='content'?'例如：沟通了4000A方案，对方计划下周做实验':'例如：下周三回访';
    f.appendChild(ta);
  } else if (s.type === 'priority') {
    const sel=document.createElement('select'); sel.id='currentField';
    ['S','A','B','C'].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v+({'S':' 重点','A':' 重要','B':' 常规','C':' 低优先'}[v]);if((answers.priority||'B')===v)o.selected=true;sel.appendChild(o)});
    f.appendChild(sel);
  } else if (s.type === 'status') {
    const sel=document.createElement('select'); sel.id='currentField';
    ['待跟进','等待客户','已完成'].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;if((answers.status||'待跟进')===v)o.selected=true;sel.appendChild(o)});
    f.appendChild(sel);
  } else {
    const input=document.createElement('input'); input.id='currentField'; input.type=s.type; input.value=answers[s.key]||'';
    if(s.type==='tel') input.inputMode='tel';
    f.appendChild(input);
  }
  setTimeout(()=>document.getElementById('currentField')?.focus(),60);
}

function capture() {
  const el=document.getElementById('currentField');
  if(!el) return;
  answers[steps[step].key]=(el.value||'').trim();
  // autofill known contact details
  if(steps[step].key==='contact') {
    const c=getCustomer(answers.customer);
    const ct=getContact(c,answers.contact);
    if(ct) {
      if(!answers.phone) answers.phone=ct.phone||'';
      if(!answers.office) answers.office=ct.office||c.defaultOffice||'';
    }
  }
}

function nextStep() {
  capture();
  const key=steps[step].key;
  if(key==='customer' && !answers.customer) return alert('请填写客户名称');
  if(key==='contact' && !answers.contact) return alert('请填写联系人');
  if(key==='content' && !answers.content) return alert('请填写本次更新内容');
  if(step < steps.length-1) {
    step++; renderStep();
  } else {
    commit();
  }
}
function prevStep() { capture(); if(step>0){step--;renderStep();} }

function commit() {
  let c=getCustomer(answers.customer);
  if(!c) {
    c={name:answers.customer,contacts:[],history:[],defaultOffice:answers.office||''};
    data.push(c);
  } else {
    // 归入已有客户后，统一使用数据库里的标准客户名称
    answers.customer=c.name;
    if(answers.office && !c.defaultOffice) c.defaultOffice=answers.office;
  }
  let ct=getContact(c,answers.contact);
  if(!ct) {
    ct={name:answers.contact,phone:answers.phone||'',office:answers.office||'',note:''};
    c.contacts=c.contacts||[]; c.contacts.push(ct);
  } else {
    // 归入已有联系人后，统一使用数据库里的联系人名称
    answers.contact=ct.name;
    if(answers.phone) ct.phone=answers.phone;
    if(answers.office) ct.office=answers.office;
  }
  c.history=c.history||[];
  c.history.push({
    date:answers.date,
    contact:answers.contact,
    office:answers.office||ct.office||c.defaultOffice||'',
    content:answers.content,
    todo:answers.todo,
    followUpAt:answers.followUpAt||'',
    priority:answers.priority||'B',
    status:answers.status||'待跟进',
    completedAt:'',
    attachments:answers.attachments||[]
  });
  saveStore();
  exportJSON(true);
  document.getElementById('formCard').classList.add('hidden');
  document.getElementById('doneCard').classList.remove('hidden');
  document.getElementById('doneText').innerHTML =
    `${esc(answers.customer)} · ${esc(answers.contact)} · ${esc(answers.date)}<br><b>已生成最新 JSON 主数据文件</b>`;
  renderDB();
  updateDataStatus();
}

function resetForm() {
  step=0;
  answers={customer:'',contact:'',phone:'',office:'',date:new Date().toISOString().slice(0,10),content:'',todo:'',followUpAt:'',priority:'B',status:'待跟进',attachments:[]};
  document.getElementById('doneCard').classList.add('hidden');
  document.getElementById('formCard').classList.remove('hidden');
  renderStep();
}

function editCustomer(ci){
  const c=data[ci]; if(!c)return;
  const newName=prompt('客户名称',c.name); if(newName===null)return;
  const newOffice=prompt('默认办公地',c.defaultOffice||''); if(newOffice===null)return;
  const n=newName.trim();
  if(!n)return alert('客户名称不能为空');
  const duplicate=data.find((x,i)=>i!==ci && normalizeName(x.name)===normalizeName(n));
  if(duplicate && !confirm(`数据库里已有“${duplicate.name}”。仍然保存为当前名称吗？`))return;
  const oldName=c.name;
  c.name=n; c.defaultOffice=newOffice.trim();
  // 保持历史记录不变，只更新客户主名称。
  saveStore(); renderDB(); renderDashboard();
  alert(`已修改客户：${oldName} → ${c.name}`);
}

function deleteCustomer(ci){
  const c=data[ci]; if(!c)return;
  if(!confirm(`确定删除客户“${c.name}”吗？\n\n这会同时删除该客户的联系人和全部拜访记录。`))return;
  data.splice(ci,1);
  saveStore(); renderDB(); renderDashboard();
}

function editContact(ci,xi){
  const c=data[ci], ct=c?.contacts?.[xi]; if(!ct)return;
  const oldName=ct.name;
  const name=prompt('联系人姓名',ct.name); if(name===null)return;
  const phone=prompt('电话',ct.phone||''); if(phone===null)return;
  const office=prompt('办公地',ct.office||''); if(office===null)return;
  const note=prompt('职位 / 备注',ct.note||''); if(note===null)return;
  if(!name.trim())return alert('联系人姓名不能为空');
  ct.name=name.trim(); ct.phone=phone.trim(); ct.office=office.trim(); ct.note=note.trim();

  // 同步历史记录中的联系人名称，避免改名后历史断开。
  (c.history||[]).forEach(h=>{
    if(normalizeName(h.contact||'')===normalizeName(oldName)) h.contact=ct.name;
  });
  saveStore(); renderDB(); renderDashboard();
}

function deleteContact(ci,xi){
  const c=data[ci], ct=c?.contacts?.[xi]; if(!ct)return;
  if(!confirm(`确定删除联系人“${ct.name}”吗？\n\n历史拜访记录不会删除，只会保留当时记录里的联系人名字。`))return;
  c.contacts.splice(xi,1);
  saveStore(); renderDB();
}

function editHistory(ci,hi){
  const c=data[ci], h=c?.history?.[hi]; if(!h)return;

  const date=prompt('拜访日期 YYYY-MM-DD',h.date||''); if(date===null)return;
  const contact=prompt('联系人',h.contact||''); if(contact===null)return;
  const office=prompt('办公地',h.office||''); if(office===null)return;
  const content=prompt('沟通内容',h.content||''); if(content===null)return;
  const todo=prompt('待办',h.todo||''); if(todo===null)return;
  const follow=prompt('跟进时间（如 2026-09-10T10:00，可留空）',h.followUpAt||''); if(follow===null)return;
  const priority=prompt('重要程度 S / A / B / C',h.priority||'B'); if(priority===null)return;
  const status=prompt('状态：待跟进 / 等待客户 / 已完成',h.status||'待跟进'); if(status===null)return;

  h.date=date.trim();
  h.contact=contact.trim();
  h.office=office.trim();
  h.content=content.trim();
  h.todo=todo.trim();
  h.followUpAt=follow.trim();
  h.priority=['S','A','B','C'].includes(priority.trim().toUpperCase())?priority.trim().toUpperCase():'B';
  h.status=['待跟进','等待客户','已完成'].includes(status.trim())?status.trim():'待跟进';
  if(h.status==='已完成' && !h.completedAt) h.completedAt=nowText();
  if(h.status!=='已完成') h.completedAt='';

  saveStore(); renderDB(); renderDashboard();
}

function deleteHistory(ci,hi){
  const c=data[ci], h=c?.history?.[hi]; if(!h)return;
  if(!confirm(`确定删除这条拜访记录吗？\n\n${h.date||''} ${h.contact||''}\n${h.content||''}`))return;
  c.history.splice(hi,1);
  saveStore(); renderDB(); renderDashboard();
}


async function exportFullBackup(){
  const db=await openAttachDB();
  const files=await new Promise((resolve,reject)=>{
    const r=db.transaction('files').objectStore('files').getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);
  });db.close();
  const packed=[];
  for(const f of files){
    const buf=await f.blob.arrayBuffer();
    let binary='',bytes=new Uint8Array(buf),chunk=0x8000;
    for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
    packed.push({id:f.id,name:f.name,type:f.type,size:f.size,createdAt:f.createdAt,base64:btoa(binary)});
  }
  const payload={format:'crm-full-backup-v1',exportedAt:new Date().toISOString(),data,files:packed};
  download(`CRM完整备份_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(payload,null,2),'application/json');
}
async function importFullBackup(file){
  if(!file)return;
  try{
    const x=JSON.parse(await file.text());
    if(x.format!=='crm-full-backup-v1'||!Array.isArray(x.data)||!Array.isArray(x.files))throw new Error('不是有效的 CRM 完整备份');
    if(!confirm(`将恢复 ${x.data.length} 个客户和 ${x.files.length} 个附件。当前本地数据库会被替换，继续吗？`))return;
    const db=await openAttachDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction('files','readwrite'),store=tx.objectStore('files');store.clear();
      for(const f of x.files){
        const bin=atob(f.base64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
        store.put({id:f.id,name:f.name,type:f.type||'',size:f.size||bytes.length,createdAt:f.createdAt||'',blob:new Blob([bytes],{type:f.type||'application/octet-stream'})});
      }
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });db.close();
    data=x.data;saveStore();renderDB();renderDashboard();updateDataStatus();alert('完整备份恢复完成');
  }catch(e){alert('恢复失败：'+e.message);}
}
function download(name, text, type) {
  const blob=new Blob([text],{type});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
}

}

function allTasks(){
  const out=[];
  data.forEach(c=>(c.history||[]).forEach((h,i)=>{
    // 旧数据库兼容：旧记录没有新字段时，不修改原内容，只给运行时默认值
    const priority=h.priority||'B', status=h.status||'待跟进';
    if(h.followUpAt) out.push({c,h,i,priority,status});
  }));
  return out;
}
function taskScore(t){
  const base={S:400,A:300,B:200,C:100}[t.priority]||200;
  const now=Date.now(), due=new Date(t.h.followUpAt).getTime(), diff=due-now;
  return base+(diff<0?260:diff<=86400000?180:diff<=7*86400000?80:0);
}
function renderDashboard(){
  const now=new Date(), end=new Date(); end.setHours(23,59,59,999);
  const week=Date.now()+7*86400000;
  const tasks=allTasks().filter(t=>t.status!=='已完成');
  let overdue=0,today=0,future=0,waiting=0;
  tasks.forEach(t=>{
    const due=new Date(t.h.followUpAt).getTime();
    if(t.status==='等待客户') waiting++;
    if(due<Date.now()) overdue++; else if(due<=end.getTime()) today++; else if(due<=week) future++;
  });
  kOverdue.textContent=overdue;kToday.textContent=today;kWeek.textContent=future;kWaiting.textContent=waiting;
  tasks.sort((a,b)=>taskScore(b)-taskScore(a));
  taskList.innerHTML=tasks.slice(0,12).map(t=>{
    const due=new Date(t.h.followUpAt), cls=due.getTime()<Date.now()?'overdue':due<=end?'today':'future';
    return `<div class="task ${cls}">
      <div class="tasktop"><b>${esc(t.c.name)}${t.h.contact?' · '+esc(t.h.contact):''}</b><span class="pri">${esc(t.priority)} · ${esc(t.status)}</span></div>
      <div style="margin-top:8px">${esc(t.h.todo||t.h.content||'跟进')}</div>
      <div class="meta">${esc(t.h.followUpAt.replace('T',' '))}</div>
      <div class="choicebar">
        <button class="secondary" onclick="setTaskStatus('${encodeURIComponent(t.c.name)}',${t.i},'已完成')">完成</button>
        <button class="secondary" onclick="snoozeTask('${encodeURIComponent(t.c.name)}',${t.i},1)">1小时后</button>
        <button class="secondary" onclick="setTaskStatus('${encodeURIComponent(t.c.name)}',${t.i},'等待客户')">等待客户</button>
      </div>
    </div>`;
  }).join('')||'<div class="meta">还没有设置跟进时间的事项。</div>';
}
function setTaskStatus(cn,i,status){
  const c=data.find(x=>x.name===decodeURIComponent(cn)); if(!c||!c.history?.[i])return;
  c.history[i].status=status;c.history[i].completedAt=status==='已完成'?nowText():'';
  saveStore();renderDashboard();
}
function snoozeTask(cn,i,hours){
  const c=data.find(x=>x.name===decodeURIComponent(cn)); if(!c||!c.history?.[i])return;
  const d=new Date(Date.now()+hours*3600000); c.history[i].followUpAt=localDateTimeValue(d);
  c.history[i].status='待跟进';saveStore();renderDashboard();
}
function localDateTimeValue(d){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

let recognition=null, listening=false;
function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('当前浏览器没有开放网页语音识别。你仍可以使用 iPhone 键盘上的麦克风，把文字说进文本框。');return;}
  if(listening){recognition?.stop();return;}
  recognition=new SR(); recognition.lang='zh-CN'; recognition.continuous=false; recognition.interimResults=true;
  recognition.onstart=()=>{listening=true;micBtn.textContent='正在听… 点这里停止';};
  recognition.onend=()=>{listening=false;micBtn.textContent='开始说话';};
  recognition.onerror=e=>{listening=false;micBtn.textContent='开始说话';alert('语音识别没有成功：'+e.error+'。也可以直接用 iPhone 键盘麦克风输入。');};
  recognition.onresult=e=>{
    let s=''; for(let i=e.resultIndex;i<e.results.length;i++) s+=e.results[i][0].transcript;
    voiceText.value=s;
  };
  recognition.start();
}
function parseRelativeDate(text){
  const now=new Date(), d=new Date(now);
  if(/明天/.test(text)) d.setDate(d.getDate()+1);
  else if(/后天/.test(text)) d.setDate(d.getDate()+2);
  else {
    const m=text.match(/下周([一二三四五六日天])/);
    if(m){const map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0};let add=(7-now.getDay()+map[m[1]])%7;if(add<2)add+=7;d.setDate(d.getDate()+add);}
  }
  let h=9,min=0;
  const tm=text.match(/(?:上午|下午|晚上)?\s*(\d{1,2})[点时](?:(\d{1,2})分?)?/);
  if(tm){h=+tm[1];min=+(tm[2]||0);if(/下午|晚上/.test(tm[0])&&h<12)h+=12;}
  d.setHours(h,min,0,0); return localDateTimeValue(d);
}

function normalizeForSpeech(s){
  return String(s||'').toLowerCase().replace(/[，。！？、；：,.!?;:\s]/g,'')
    .replace(/有限责任公司|股份有限公司|集团有限公司|有限公司|集团公司|公司/g,'')
    .replace(/电气设备|电气|开关设备|开关|高压电器|高压|中压/g,'')
    .replace(/[（）()·\-—_]/g,'');
}
function extractCustomerPhrase(text){
  const pats=[
    /(?:今天|昨天|前天)?(?:去|到|拜访了?|拜访|去了|见了|客户是|客户为)\s*([^，。,.；;]{2,18}?)(?=的|，|。|,|；|;|见|找|和|跟|聊|联系人|$)/,
    /客户(?:叫|是|为)?\s*([^，。,.；;]{2,18}?)(?=，|。|,|；|;|联系人|聊|$)/
  ];
  for(const p of pats){const m=text.match(p);if(m&&m[1])return m[1].trim();}
  return '';
}
function companyCoreTokens(name){
  const n=normalizeForSpeech(name), out=[n];
  ['电器','电气','高压','中压','开关','集团','能源','科技','设备'].forEach(s=>{if(n.endsWith(s)&&n.length>s.length+1)out.push(n.slice(0,-s.length))});
  if(n.length>=4){out.push(n.slice(0,4),n.slice(-4))}
  if(n.length>=3){out.push(n.slice(0,3),n.slice(-3))}
  return [...new Set(out.filter(x=>x.length>=2))];
}
function customerSpeechCandidates(text){
  const phrase=extractCustomerPhrase(text), nt=normalizeForSpeech(text), np=normalizeForSpeech(phrase);
  return data.map(c=>{
    const cn=normalizeForSpeech(c.name);let s=0,reasons=[];
    if(phrase){
      if(cn===np){s+=1.25;reasons.push('语音片段完全匹配')}
      else if(cn.includes(np)||np.includes(cn)){s+=.95;reasons.push('语音片段包含匹配')}
      else {const sim=similarity(phrase,c.name);s+=sim*.9;if(sim>.5)reasons.push('名称相似')}
    }
    if(nt.includes(cn)){s+=1.1;reasons.push('整句直接出现')}
    companyCoreTokens(c.name).forEach(t=>{if(nt.includes(t)){s+=Math.min(.55,.16*t.length);reasons.push('简称命中')}});
    ['北京','天津','上海','西安','杭州','常州','镇江','宁波','成都','衡阳','泰州','昆山','石家庄','青州','如皋'].forEach(r=>{if(text.includes(r)&&c.name.includes(r))s+=.28});
    return {c,score:s,reasons:[...new Set(reasons)]};
  }).filter(x=>x.score>.22).sort((a,b)=>b.score-a.score).slice(0,6);
}
function contactSpeechCandidates(customer,text){
  if(!customer)return [];
  return (customer.contacts||[]).map(ct=>{
    let s=0,reasons=[];
    if(text.includes(ct.name)){s+=1.2;reasons.push('姓名直接出现')}
    const surname=ct.name.slice(0,1);
    if(surname&&new RegExp(surname+'(?:经理|总|工|主任|老师)').test(text)){s+=.65;reasons.push('姓氏+称呼')}
    if(ct.note&&text.includes(ct.note)){s+=.25;reasons.push('职位命中')}
    return {ct,score:s,reasons};
  }).filter(x=>x.score>.15).sort((a,b)=>b.score-a.score).slice(0,6);
}
function confidenceText(score){return score>=1.05?['高','confhigh']:score>=.58?['中','confmid']:['低','conflow'];}
function inferTodo(text){
  for(const p of [/(?:我要|需要|准备|计划|记得|到时候|后面|之后)([^，。,.；;]{2,30})/,/(?:跟进|回访|联系|确认|发送|发|报价|样品)([^，。,.；;]{0,24})/]){
    const m=text.match(p);if(m)return (m[0]||'').trim();
  } return '';
}
function inferVisitDate(text){
  const d=new Date(); if(/昨天/.test(text))d.setDate(d.getDate()-1); else if(/前天/.test(text))d.setDate(d.getDate()-2);
  const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
}
function inferPriority(text){
  if(/非常重要|特别重要|重点项目|必须盯|最重要|关键/.test(text))return 'S';
  if(/比较重要|很重要|重要|尽快|抓紧/.test(text))return 'A';
  if(/不急|有空|长期|保持联系/.test(text))return 'C';
  return 'B';
}
function extractVoice(){
  const text=voiceText.value.trim(); if(!text)return alert('请先说一段话或输入文字');
  const customerCandidates=customerSpeechCandidates(text);
  const chosen=customerCandidates[0]?.score>=.58?customerCandidates[0].c:null;
  const contactCandidates=contactSpeechCandidates(chosen,text);
  const chosenContact=contactCandidates[0]?.score>=.58?contactCandidates[0].ct:null;
  window.voiceDraft={customer:chosen?.name||'',contact:chosenContact?.name||'',date:inferVisitDate(text),content:text,todo:inferTodo(text),
    followUpAt:/下周|明天|后天|上午|下午|晚上|\d{1,2}[点时]/.test(text)?parseRelativeDate(text):'',priority:inferPriority(text),status:'待跟进',attachments:[]};
  window.voiceCustomerCandidates=customerCandidates;window.voiceContactCandidates=contactCandidates;
  renderVoiceConfirm(customerCandidates,contactCandidates);
}
function candidateButtons(arr,field,key){
  if(!arr.length)return `<div class="choicebar"><button class="secondary" onclick="voiceManual('${field}')">手动输入</button></div>`;
  return `<div class="candidatebox">${arr.map(x=>{const obj=x[key],[lab,cls]=confidenceText(x.score);return `<div class="candidate"><div><b>${esc(obj.name)}</b><div class="meta">${esc((x.reasons||[]).join(' · ')||'候选')}</div></div><div><span class="confidence ${cls}">${lab}置信</span> <button class="secondary small" onclick="voicePick('${field}','${encodeURIComponent(obj.name)}')">选择</button></div></div>`}).join('')}</div><div class="choicebar"><button class="secondary" onclick="voiceManual('${field}')">都不是，手动输入</button></div>`;
}
function renderVoiceConfirm(customers=window.voiceCustomerCandidates||[],contacts=window.voiceContactCandidates||[]){
  const d=window.voiceDraft;
  voiceConfirm.innerHTML=`<div class="confirmgrid">
  <div class="confirmitem ${d.customer?'':'warn'}"><b>客户</b><div>${esc(d.customer||'未确定')}</div>${candidateButtons(customers,'customer','c')}</div>
  <div class="confirmitem ${d.contact?'':'warn'}"><b>联系人</b><div>${esc(d.contact||'未确定')}</div>${candidateButtons(contacts,'contact','ct')}</div>
  <div class="confirmitem"><b>拜访日期</b><input id="vcDate" type="date" value="${esc(d.date)}"></div>
  <div class="confirmitem"><b>沟通内容</b><textarea id="vcContent">${esc(d.content)}</textarea></div>
  <div class="confirmitem"><b>待办</b><textarea id="vcTodo" placeholder="例如：发送报价、确认样品">${esc(d.todo)}</textarea></div>
  <div class="confirmitem ${d.followUpAt?'':'warn'}"><b>跟进时间</b><input id="vcFollow" type="datetime-local" value="${esc(d.followUpAt)}"></div>
  <div class="confirmitem"><b>重要程度</b><select id="vcPri">${['S','A','B','C'].map(x=>`<option ${d.priority===x?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="confirmitem"><b>状态</b><select id="vcStatus">${['待跟进','等待客户','已完成'].map(x=>`<option ${d.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="confirmitem">
    <b>附件 / 链接</b>
    <div class="meta">文件保存在本机 CRM 附件库；也可以只保存 iCloud、网盘、网页等链接。</div>
    <div class="choicebar">
      <button class="secondary" onclick="document.getElementById('voiceFileInput').click()">添加文件/照片</button>
      <button class="secondary" onclick="addVoiceLink()">添加链接</button>
    </div>
    <input id="voiceFileInput" type="file" multiple style="display:none" onchange="addVoiceFiles(this.files)">
    <div id="voiceAttachments"></div>
  </div>
  </div><div class="row"><button class="primary" onclick="saveVoiceDraft()">确认并保存</button></div>`;
  setTimeout(renderVoiceAttachments,0);
}
function voicePick(field,val){
  const value=decodeURIComponent(val);window.voiceDraft[field]=value;
  if(field==='customer'){const c=getCustomer(value);window.voiceContactCandidates=contactSpeechCandidates(c,voiceText.value.trim());window.voiceDraft.contact=window.voiceContactCandidates[0]?.score>=.58?window.voiceContactCandidates[0].ct.name:'';}
  renderVoiceConfirm();
}
function voiceManual(field){
  const v=prompt('请输入'+(field==='customer'?'客户全称':'联系人'));
  if(v){window.voiceDraft[field]=v;if(field==='customer')window.voiceContactCandidates=contactSpeechCandidates(getCustomer(v),voiceText.value.trim());renderVoiceConfirm();}
}

function newId(){return 'a_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);}
function openAttachDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('crm_attachments_v1',1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'id'});};
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
async function putLocalFile(file){
  const db=await openAttachDB(), id=newId();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction('files','readwrite');
    tx.objectStore('files').put({id,name:file.name,type:file.type||'',size:file.size,blob:file,createdAt:new Date().toISOString()});
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  });
  db.close(); return {id,kind:'local',name:file.name,type:file.type||'',size:file.size,note:''};
}
async function getLocalFile(id){
  const db=await openAttachDB();
  const rec=await new Promise((resolve,reject)=>{const r=db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
  db.close();return rec;
}
async function deleteLocalFile(id){
  const db=await openAttachDB();
  await new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
  db.close();
}
async function addVoiceFiles(files){
  if(!window.voiceDraft)return;
  window.voiceDraft.attachments=window.voiceDraft.attachments||[];
  for(const f of Array.from(files||[])){
    try{window.voiceDraft.attachments.push(await putLocalFile(f));}catch(e){alert('附件保存失败：'+e.message);}
  }
  renderVoiceAttachments();
}
function addVoiceLink(){
  if(!window.voiceDraft)return;
  const url=prompt('请输入链接（例如 iCloud/网盘共享链接、客户官网等）','https://');if(!url)return;
  const name=prompt('给这个链接起个名称','链接')||'链接';
  window.voiceDraft.attachments=window.voiceDraft.attachments||[];
  window.voiceDraft.attachments.push({id:newId(),kind:'link',name:name.trim(),url:url.trim(),note:''});
  renderVoiceAttachments();
}
function renderVoiceAttachments(){
  const box=document.getElementById('voiceAttachments');if(!box||!window.voiceDraft)return;
  const arr=window.voiceDraft.attachments||[];
  box.innerHTML=arr.map((a,i)=>`<div class="attachitem"><div class="attachmeta"><div class="attachname">${esc(a.name||'附件')}</div><div class="meta">${a.kind==='link'?'链接':'本地文件'}${a.size?' · '+Math.round(a.size/1024)+' KB':''}</div></div><button class="delbtn" onclick="removeVoiceAttachment(${i})">移除</button></div>`).join('')||'<div class="meta">暂无附件</div>';
}
async function removeVoiceAttachment(i){
  const a=window.voiceDraft?.attachments?.[i];if(!a)return;
  if(a.kind==='local')await deleteLocalFile(a.id);
  window.voiceDraft.attachments.splice(i,1);renderVoiceAttachments();
}
async function openAttachment(ci,hi,ai){
  const a=data?.[ci]?.history?.[hi]?.attachments?.[ai];if(!a)return;
  if(a.kind==='link'){window.open(a.url,'_blank');return;}
  const rec=await getLocalFile(a.id);if(!rec?.blob)return alert('这个本地附件已不在当前设备。请从完整备份恢复，或重新添加。');
  const u=URL.createObjectURL(rec.blob);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000);
}
async function removeHistoryAttachment(ci,hi,ai){
  const h=data?.[ci]?.history?.[hi],a=h?.attachments?.[ai];if(!a)return;
  if(!confirm(`确定移除附件“${a.name||'附件'}”吗？`))return;
  if(a.kind==='local')await deleteLocalFile(a.id);
  h.attachments.splice(ai,1);saveStore();renderDB();
}
async function addHistoryFiles(ci,hi,files){
  const h=data?.[ci]?.history?.[hi];if(!h)return;h.attachments=h.attachments||[];
  for(const f of Array.from(files||[]))h.attachments.push(await putLocalFile(f));
  saveStore();renderDB();
}
function addHistoryLink(ci,hi){
  const h=data?.[ci]?.history?.[hi];if(!h)return;
  const url=prompt('请输入链接','https://');if(!url)return;
  const name=prompt('链接名称','链接')||'链接';
  h.attachments=h.attachments||[];h.attachments.push({id:newId(),kind:'link',name:name.trim(),url:url.trim(),note:''});
  saveStore();renderDB();
}
function saveVoiceDraft(){
  const d=window.voiceDraft;if(!d)return;
  d.date=vcDate.value;d.content=vcContent.value.trim();d.todo=vcTodo.value.trim();d.followUpAt=vcFollow.value;d.priority=vcPri.value;d.status=vcStatus.value;
  if(!d.customer||!d.contact||!d.content)return alert('客户、联系人和沟通内容需要确认');
  answers={customer:d.customer,contact:d.contact,phone:'',office:'',date:d.date,content:d.content,todo:d.todo,followUpAt:d.followUpAt,priority:d.priority,status:d.status,attachments:d.attachments||[]};
  commit(); voiceText.value=''; voiceConfirm.innerHTML=''; showTab('dash'); renderDashboard();
}

if('serviceWorker' in navigator && location.protocol!=='file:'){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

renderStep();
renderDB();
renderDashboard();
updateDataStatus();
showTab('dash');
</script>
